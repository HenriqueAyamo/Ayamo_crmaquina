# Deploy para Cloudflare Workers.
#
# Substituiu o deploy para GitHub Pages: o sistema agora exige login, e o login
# precisa de um servidor com banco (D1). GitHub Pages só serve arquivo estático,
# então publicar lá deixaria o app inacessível — ninguém consegue autenticar.
#
# Pré-requisitos (uma vez só):
#   1. Secrets do repositório: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID
#   2. Secret do Worker:  npx wrangler secret put OPENAI_API_KEY
#   3. Schema no banco:   npx wrangler d1 execute ayamo_ia_uso --remote --file=./worker/schema.sql
#   4. Primeiro usuário:  node scripts/criar-usuario.mjs "voce@ayamo.com" "Seu Nome" "Administrador" > admin.sql
#                         npx wrangler d1 execute ayamo_ia_uso --remote --file=./admin.sql
#                         (apague admin.sql depois — ele carrega o hash da senha)

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Publicar Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
